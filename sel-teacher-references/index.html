<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEL 參考文章｜SEL 教師專區</title>
  <style>
    :root{--ink:#253238;--muted:#60717a;--line:#d7e2dd;--teal:#3f8f86;--teal-dark:#255f5a;--coral:#d8665b;--gold:#d7a842;--leaf:#6aa76f;--sky:#5f91aa;--violet:#8a7ab6;--paper:#fffaf1;--surface:#fff;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:linear-gradient(135deg,#fff8ec,#edf7f3 54%,#edf4f8);line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #2f7598;outline-offset:3px}.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto}.top{padding:20px 0}.back{display:inline-flex;align-items:center;min-height:42px;padding:8px 12px;border-radius:8px;background:#fff;border:1px solid var(--line);text-decoration:none;font-weight:900}.hero{padding:28px 0 24px}.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:center}.eyebrow{margin:0 0 10px;color:var(--teal-dark);font-weight:900}h1{margin:0;font-size:clamp(2rem,5vw,4rem);line-height:1.12;letter-spacing:0}.lead{margin:18px 0 0;max-width:720px;color:#4c5f66;font-size:clamp(1.05rem,2vw,1.26rem)}.signal{min-height:260px;display:grid;place-items:center;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 14px 34px rgba(48,67,70,.1)}.shape{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff 0 24%,transparent 25%),linear-gradient(135deg,var(--gold),var(--teal));box-shadow:0 0 0 22px rgba(63,143,134,.15)}.section{padding:24px 0}.band{background:rgba(255,255,255,.72);border-top:1px solid rgba(255,255,255,.8);border-bottom:1px solid rgba(54,89,89,.12)}.story{display:grid;grid-template-columns:.8fr 1.2fr;gap:18px}.panel,.card{padding:20px;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 10px 24px rgba(50,75,76,.08)}h2{margin:0 0 12px;font-size:clamp(1.45rem,3vw,2.1rem);letter-spacing:0}.goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0 0;padding:0;list-style:none}.goals li{padding:14px;border-radius:8px;background:#f3f9f6;border:1px solid #d7e8e1;font-weight:900}.activity{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}.visual{min-height:320px;display:grid;place-items:center;padding:18px;border-radius:8px;background:#f7fbf8;border:1px solid #d7e8e1}.choices{display:grid;gap:10px}.choice{width:100%;min-height:54px;padding:11px 13px;border-radius:8px;border:1px solid var(--line);background:#fbfefd;text-align:left;color:var(--ink)}.choice:hover{background:#fff;border-color:#9fc4bb}.choice.selected{background:#e6f4ef;border-color:var(--teal);box-shadow:inset 4px 0 0 var(--teal);font-weight:900}.feedback{min-height:92px;margin-top:14px;padding:14px;border-radius:8px;background:#f3f6f4;border:1px solid #c9dcd6;color:#344a50}.meter-line{width:min(420px,100%)}input[type=range]{width:100%;accent-color:var(--teal)}.score{font-size:3rem;font-weight:900;color:var(--teal-dark);text-align:center}.weather-icons,.body-map,.step-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}.icon-tile,.body-part,.step-chip{min-height:96px;display:grid;place-items:center;text-align:center;padding:12px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:900}.breath-orb{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff 0 28%,transparent 29%),radial-gradient(circle at 35% 30%,#e0f7eb,#78bea0);box-shadow:0 0 0 20px rgba(120,190,160,.16);animation:breathe 5.6s ease-in-out infinite}@keyframes breathe{0%,100%{transform:scale(.78)}45%,60%{transform:scale(1)}}.reflect{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.reflect label{display:block;margin-bottom:8px;font-weight:900}textarea{width:100%;min-height:110px;resize:vertical;padding:12px;border-radius:8px;border:1px solid #c8d9d4}.teacher{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.reset{min-height:44px;margin-top:14px;padding:9px 14px;border:0;border-radius:8px;background:#455b61;color:#fff;font-weight:900}@media(max-width:880px){.hero-grid,.story,.activity,.goals,.reflect,.teacher{grid-template-columns:1fr}.signal{min-height:220px}}@media(max-width:560px){.wrap{width:min(100% - 22px,1120px)}.weather-icons,.body-map,.step-list{grid-template-columns:1fr}.panel,.card{padding:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <div class="top wrap"><a class="back" href="../sel-learning-center/index.html">回教材中心</a></div>
  <header class="hero wrap">
    <p class="eyebrow">教師專區｜SEL 社會情緒學習</p>
    <h1>SEL 參考文章</h1>
    <p class="lead">整理教師備課時可使用的概念摘要與對話句型。</p>
  </header>
  <main class="section wrap">
    <div class="teacher"><article class="card"><p>核心概念：自我覺察、自我管理、社會覺察、人際技巧、負責任決策。</p></article><article class="card"><p>班級語句：我看到、我感覺、我需要、我建議。</p></article><article class="card"><p>帶班提醒：先穩定關係，再處理行為；先描述事實，再討論修正。</p></article></div>
  </main>
</body>
</html>
