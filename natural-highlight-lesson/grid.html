    <div class="page-title">
      <p class="eyebrow">Step 2</p>
      <h1>九宮格重點整理</h1>
      <p>九宮格用來整理「關鍵詞、作用、證據」。點選格子可看一句話說明。</p>
    </div>
  </header>
  <main>
    <section class="section">
      <div class="grid-nine" aria-label="九宮格重點整理">
        <button class="grid-cell" type="button" data-detail="雨水進入森林後，會被樹冠、落葉層與土壤分段處理。"><strong>雨水</strong><span>水循環起點</span></button>
        <button class="grid-cell" type="button" data-detail="樹冠可暫時攔住雨滴，降低雨水直接衝擊地面的力量。"><strong>樹冠截留</strong><span>減少沖刷</span></button>
        <button class="grid-cell" type="button" data-detail="枯枝落葉像海綿，能保存水分並保護表土。"><strong>落葉層</strong><span>吸水保土</span></button>
        <button class="grid-cell" type="button" data-detail="土壤孔隙讓水往地下移動，也讓根部取得水分。"><strong>土壤孔隙</strong><span>滲透通道</span></button>
        <button class="grid-cell center" type="button" data-detail="森林水循環的核心是：水被保留、移動、蒸散、補注，再回到溪流和大氣。"><strong>森林水循環</strong><span>核心概念</span></button>
        <button class="grid-cell" type="button" data-detail="植物將水從根送到葉，再由氣孔散到空氣中。"><strong>蒸散作用</strong><span>植物送水</span></button>
        <button class="grid-cell" type="button" data-detail="地下水流動慢，能在乾旱時補充溪流。"><strong>地下水</strong><span>慢慢供水</span></button>
        <button class="grid-cell" type="button" data-detail="森林溪流能否穩定，和上游土壤與植被保存水分的能力有關。"><strong>溪流</strong><span>水量穩定</span></button>
        <button class="grid-cell" type="button" data-detail="保護森林可降低土壤流失，並維持水資源與棲地品質。"><strong>保護森林</strong><span>生活行動</span></button>
      </div>
      <p class="detail-box" id="gridDetail" aria-live="polite">點選九宮格任一格，查看重點說明。</p>
    </section>
    <section class="section split">
      <div>
        <h2>如何使用空白九宮格</h2>
        <p>中心格放主題，其餘八格放關鍵詞。每格只寫一個重點和一句說明，避免把文章整段抄進去。</p>
      </div>
      <a class="button-link" href="downloads/blank-nine-grid.pdf" download>下載空白九宮格 PDF</a>
    </section>
