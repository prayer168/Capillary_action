  <style>
    :root {
      --bg: #f4f7fb;
      --paper: #ffffff;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d8e1ee;
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --teal: #0f766e;
      --amber: #b45309;
      --rose: #be123c;
      --shadow: 0 14px 32px rgba(15, 23, 42, .08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, .12), transparent 32rem),
        linear-gradient(180deg, #eef6ff 0%, var(--bg) 42%, #fff 100%);
      line-height: 1.65;
    }

    header {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0 18px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: 7px 13px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: #1d4ed8;
      font-weight: 800;
      font-size: .95rem;
    }

    h1 {
      margin: 18px 0 8px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1.12;
      letter-spacing: 0;
    }

    .lead {
      max-width: 860px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .wrap {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto 52px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: center;
      margin: 22px 0;
      padding: 12px;
      background: rgba(244, 247, 251, .9);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .search {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 11px 14px;
      font: inherit;
      outline: none;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: #334155;
      padding: 8px 13px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .86);
      padding: 15px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, .05);
    }

    .stat b { display: block; font-size: 1.45rem; line-height: 1; }
    .stat span { display: block; margin-top: 8px; color: var(--muted); font-weight: 700; }

    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 32px 0 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.15rem);
    }

    .badge {
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      padding: 5px 10px;
      font-size: .9rem;
      font-weight: 900;
    }

    .grade {
      margin: 0 0 26px;
    }

    .grade-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 0 10px;
    }

    .grade h3 {
      margin: 0;
      font-size: 1.42rem;
    }

    .hint {
      color: var(--muted);
      font-size: .95rem;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .publisher {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .publisher h4 {
      margin: 0;
      padding: 13px 16px;
      background: var(--teal);
      color: #fff;
      font-size: 1.13rem;
      letter-spacing: 0;
    }

    .publisher[data-publisher="翰林"] h4 { background: var(--blue); }
    .publisher[data-publisher="南一"] h4 { background: var(--amber); }

    .unit {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }

    .unit:first-of-type { border-top: 0; }

    .unit-title {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 7px;
      font-size: 1.04rem;
      font-weight: 900;
    }

    .dot {
      width: 9px;
      height: 9px;
      margin-top: .55rem;
      border-radius: 50%;
      background: var(--teal);
      flex: 0 0 auto;
    }

    .publisher[data-publisher="翰林"] .dot { background: var(--blue); }
    .publisher[data-publisher="南一"] .dot { background: var(--amber); }

    ul { list-style: none; margin: 0; padding: 0; }
    li { padding: 2px 0; color: #334155; }
    mark { border-radius: 4px; background: #fef08a; padding: 0 2px; }

    .no-result {
      display: none;
      margin-top: 18px;
      border: 1px solid #fed7aa;
      border-radius: var(--radius);
      background: #fff7ed;
      padding: 18px;
      color: #9a3412;
      text-align: center;
      font-weight: 800;
    }

    .sources {
      margin-top: 36px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--muted);
    }

    .sources h2 {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 1.1rem;
    }

    .sources a { color: #1d4ed8; font-weight: 800; }

    @media (max-width: 980px) {
      .toolbar { grid-template-columns: 1fr; }
      .chips { justify-content: flex-start; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: 1fr; }
      .publisher h4 { position: sticky; top: 86px; z-index: 2; }
      .grade-head { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 560px) {
      header, .wrap { width: min(100% - 20px, 1160px); }
      header { padding-top: 28px; }
      .summary { grid-template-columns: 1fr; }
      .chip { flex: 1 1 auto; }
    }

    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .publisher { box-shadow: none; break-inside: avoid; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      header, .wrap { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">115 學年度｜國小自然科</div>
    <h1>康軒、翰林、南一課程架構並列</h1>
    <p class="lead">依三年級到六年級、上學期到下學期整理三家書商自然科單元與活動。可用來做課程銜接、跨版本主題比對、備課進度規劃與公開展示。</p>
  </header>

  <main class="wrap">
    <div class="toolbar" aria-label="篩選工具列">
      <input id="search" class="search" type="search" placeholder="搜尋年級、單元、活動或關鍵字，例如：電磁、昆蟲、水溶液、天氣、星空" />
      <div class="chips" role="group" aria-label="年級篩選">
        <button class="chip active" data-level="all">全部</button>
        <button class="chip" data-level="中年級">中年級</button>
        <button class="chip" data-level="高年級">高年級</button>
      </div>
      <div class="chips" role="group" aria-label="書商篩選">
        <button class="chip active" data-publisher="all">三版本</button>
        <button class="chip" data-publisher="康軒">康軒</button>
        <button class="chip" data-publisher="翰林">翰林</button>
        <button class="chip" data-publisher="南一">南一</button>
      </div>
    </div>

    <section class="summary" aria-label="資料摘要">
      <div class="stat"><b>3</b><span>書商版本</span></div>
      <div class="stat"><b>4</b><span>年級段：三至六年級</span></div>
      <div class="stat"><b>8</b><span>上下學期架構</span></div>
      <div class="stat"><b>90+</b><span>單元與活動條目</span></div>
    </section>

    <div id="content"></div>
    <div id="noResult" class="no-result">找不到符合的課程內容，請換一個關鍵字或篩選條件試試。</div>

    <section class="sources">
      <h2>資料來源與整理說明</h2>
      <p>本頁依 2026-06-22 可公開查閱之三家官方教材博覽會與簡介本整理：<a href="https://945cloud.knsh.com.tw/show/E/expo/inner-page.html?expo=textbook&subject=science" target="_blank" rel="noopener">康軒國小教材博覽會自然</a>、<a href="https://el.hle.com.tw/class/natural/index.html" target="_blank" rel="noopener">翰林 115 國小教材博覽會自然</a>、<a href="https://naniexpo.nani.com.tw/template/subject.php?grade=science" target="_blank" rel="noopener">南一教材博覽會自然</a>。表格文字以各簡介本「課程架構／單元架構」頁為主，僅做版面重排與檢索化。</p>
    </section>
  </main>

  <script>
    const data = JSON.parse(document.getElementById("course-data").textContent);
    const content = document.getElementById("content");
    const searchInput = document.getElementById("search");
    const noResult = document.getElementById("noResult");
    let currentLevel = "all";
    let currentPublisher = "all";

    function escapeRegExp(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, query) {
      if (!query) return text;
      return text.replace(new RegExp(escapeRegExp(query), "gi"), match => `<mark>${match}</mark>`);
    }

    function unitText(units) {
      return units.map(unit => [unit.u, ...unit.l].join(" ")).join(" ");
    }

    function render() {
      const query = searchInput.value.trim();
      const queryLower = query.toLowerCase();
      content.innerHTML = "";
      let visibleCount = 0;

      Object.entries(data).forEach(([level, grades]) => {
        if (currentLevel !== "all" && currentLevel !== level) return;

        const levelEl = document.createElement("section");
        levelEl.className = "level";
        levelEl.innerHTML = `<div class="section-title"><h2>${level}</h2><span class="badge">${Object.keys(grades).join("、")}</span></div>`;
        let levelVisible = false;

        Object.entries(grades).forEach(([grade, publishers]) => {
          const publisherEntries = Object.entries(publishers).filter(([publisher]) => currentPublisher === "all" || currentPublisher === publisher);
          const gradeText = [level, grade, ...publisherEntries.map(([publisher, units]) => `${publisher} ${unitText(units)}`)].join(" ");
          if (query && !gradeText.toLowerCase().includes(queryLower)) return;

          levelVisible = true;
          visibleCount += 1;

          const gradeEl = document.createElement("article");
          gradeEl.className = "grade";
          gradeEl.innerHTML = `<div class="grade-head"><h3>${grade}</h3><div class="hint">${currentPublisher === "all" ? "三版本並列比較" : `${currentPublisher}版本`}</div></div>`;

          const grid = document.createElement("div");
          grid.className = "grid";
          publisherEntries.forEach(([publisher, units]) => {
            const pubEl = document.createElement("section");
            pubEl.className = "publisher";
            pubEl.dataset.publisher = publisher;
            pubEl.innerHTML = `<h4>${publisher}</h4>` + units.map(unit => `
              <div class="unit">
                <div class="unit-title"><span class="dot"></span>${highlight(unit.u, query)}</div>
                <ul>${unit.l.map(item => `<li>${highlight(item, query)}</li>`).join("")}</ul>
              </div>
            `).join("");
            grid.appendChild(pubEl);
          });

          gradeEl.appendChild(grid);
          levelEl.appendChild(gradeEl);
        });

        if (levelVisible) content.appendChild(levelEl);
      });

      noResult.style.display = visibleCount ? "none" : "block";
    }

    document.querySelectorAll("[data-level]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-level]").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        currentLevel = button.dataset.level;
        render();
      });
    });

    document.querySelectorAll("[data-publisher]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-publisher]").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        currentPublisher = button.dataset.publisher;
        render();
      });
    });

    searchInput.addEventListener("input", render);
    render();
  </script>
